<section class="card orange">
  <div class="icon">🔔</div>
  <div>
    <h2>Zone de notifications</h2>
    <p>Vous avez {{ notifications.length }} nouvelles notifications.</p>
    <button (click)="toggle()">
      {{ visible() ? 'Masquer' : 'Afficher' }} les notifications
    </button>
    @if (visible()) {
      <ul>
        @for (n of notifications; track n) {
          <li>{{ n }}</li>
        }
      </ul>
    }
  </div>
</section>
